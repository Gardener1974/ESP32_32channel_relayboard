; ============================================================================
; PROJEKT:   ESP32 32-csatornás relékártya vezérlő (RECEIVER)
; VERZIÓ:    v0.01
; DÁTUM:     2026-09-19 22:57
; PlatformIO konfiguráció — ESP32 (ESP-WROOM-32E)
;
; Szerep: "buta" ESP-NOW fogadó. Routerhez nem csatlakozik.
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D APP_VERSION=\"v0.01\"

; A projekt saját moduljai a lib/ alatt automatikusan bekerülnek:
;   lib/RelayBoard32   - 32 relé hajtás (74HC595)
;   lib/EspNowSchedule - ESP-NOW fogadás + egyszerű időzítés
;   lib/ModbusMasterRS485 - (megtartva, későbbi felhasználásra)

; ==================== END OF FILE ====================
