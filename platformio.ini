; ============================================================================
; PROJEKT:   ESP32 32-csatornás relékártya vezérlő
; VERZIÓ:    v0.01
; DÁTUM:     2026-09-19 22:00
; PlatformIO konfiguráció — ESP32 (ESP-WROOM-32E)
; ============================================================================
;
; Követelmény: a moduláris felépítés (lib/<Modul>/), a main.cpp csak kompozíció.
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D APP_VERSION=\"v0.01\"

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; A projekt saját moduljai a lib/ alatt automatikusan bekerülnek.

; ==================== END OF FILE ====================
